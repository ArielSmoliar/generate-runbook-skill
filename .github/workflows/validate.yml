name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile scripts
        run: python -m py_compile plugins/generate-runbook/skills/generate-runbook/scripts/*.py scripts/*.py

      - name: Reject committed generated files
        run: |
          if git ls-files | grep -E '(^|/)(__pycache__/|[^/]+\.pyc$)'; then
            echo "Generated Python cache files must not be committed."
            exit 1
          fi

      - name: Run tests
        run: python plugins/generate-runbook/skills/generate-runbook/scripts/test_skill.py

      - name: Validate template
        run: |
          python plugins/generate-runbook/skills/generate-runbook/scripts/validate_runbook.py \
            plugins/generate-runbook/skills/generate-runbook/assets/runbook-template.md

      - name: Check installer targets
        run: |
          python plugins/generate-runbook/skills/generate-runbook/scripts/install_skill.py \
            --target all \
            --dry-run

      - name: Validate skill metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          skill = Path(
              "plugins/generate-runbook/skills/generate-runbook/SKILL.md"
          ).read_text(encoding="utf-8")
          assert skill.startswith("---\n")
          frontmatter = skill.split("---", 2)[1]
          assert re.search(r"^name: generate-runbook$", frontmatter, re.MULTILINE)
          assert re.search(r"^description: .+$", frontmatter, re.MULTILINE)
          assert "TODO" not in skill
          print("Skill metadata is valid")
          PY

      - name: Validate Codex plugin
        run: python scripts/validate_manifests.py

      - name: Build deterministic release archive
        run: |
          python scripts/build_release.py --output /tmp/release-one
          python scripts/build_release.py --output /tmp/release-two
          cmp /tmp/release-one/generate-runbook-v0.2.1.zip /tmp/release-two/generate-runbook-v0.2.1.zip
